# =============================================================
# nginx.conf — reference server block for the static site
#
# Copy the server blocks below into your nginx configuration and adjust
# `server_name` and the certificate paths. See SECURITY.md for detail.
# =============================================================

# Hide the nginx version from the Server header and error pages.
# This directive belongs in the top-level `http { }` block.
server_tokens off;

# ---------- Redirect all plaintext HTTP to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME challenges must stay reachable over HTTP for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- The site ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    root /var/www/supermarket-management;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- Security headers ----------
    # `always` makes nginx send them on error responses too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ---------- No directory listings ----------
    autoindex off;

    # ---------- Caching ----------
    # Releases are versioned in VERSION / version.json rather than by filename
    # hash, so HTML and release metadata are always revalidated.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /VERSION {
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* ^/(css|js)/ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---------- Keep project metadata private ----------
    location ~* /(CHANGELOG|SECURITY)\.md$ {
        return 404;
    }
    location ~ /\. {
        deny all;
    }

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    error_page 404 /index.html;
}
