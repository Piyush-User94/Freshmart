<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP here also covers file:// use; header-only policies live in .htaccess / _headers / vercel.json (see SECURITY.md) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Inventory</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>%F0%9F%9B%92</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/version.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/inventory.js" defer></script>
  </head>
  <body data-page="inventory" data-title="Inventory">
    <div id="page">
      <div class="page-head">
        <div class="page-head__text">
          <h2>Inventory</h2>
          <p>Track stock levels, adjust quantities and spot issues early.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn--ghost" id="exportBtn">Export CSV</button>
        </div>
      </div>

      <div class="mini-stats" id="miniStats"></div>

      <div class="card section-gap">
        <div class="card__body">
          <div class="toolbar">
            <div class="search-box">
              <span></span>
              <input type="search" id="search" placeholder="Search product or SKU…" aria-label="Search inventory" />
            </div>
            <select class="select" id="filterStatus" aria-label="Filter by status">
              <option value="">All status</option>
              <option value="In Stock">In Stock</option>
              <option value="Low Stock">Low Stock</option>
              <option value="Out of Stock">Out of Stock</option>
              <option value="Expiring Soon">Expiring Soon</option>
              <option value="Expired">Expired</option>
            </select>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>SKU</th>
                  <th class="num">Current Stock</th>
                  <th class="num">Min Stock</th>
                  <th>Status</th>
                  <th>Expiry</th>
                  <th class="num">Actions</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>

      <div class="card section-gap">
        <div class="card__head"><h3>Recent stock movements</h3></div>
        <div class="card__body" id="movements"></div>
      </div>
    </div>
  </body>
</html>
