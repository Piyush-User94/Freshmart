<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP here also covers file:// use; header-only policies live in .htaccess / _headers / vercel.json (see SECURITY.md) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Products</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>%F0%9F%9B%92</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="js/version.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/products.js" defer></script>
  </head>
  <body data-page="products" data-title="Products">
    <div id="page">
      <div class="page-head">
        <div class="page-head__text">
          <h2>Products</h2>
          <p>Manage your product catalogue, pricing and stock.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn--ghost" id="exportBtn">Export CSV</button>
          <button class="btn btn--primary" id="addBtn">Add Product</button>
        </div>
      </div>

      <div class="card">
        <div class="card__body">
          <div class="toolbar">
            <div class="search-box">
              <span></span>
              <input type="search" id="search" placeholder="Search name, SKU or brand…" aria-label="Search products" />
            </div>
            <select class="select" id="filterCategory" aria-label="Filter by category"></select>
            <select class="select" id="filterStatus" aria-label="Filter by stock status">
              <option value="">All status</option>
              <option value="In Stock">In Stock</option>
              <option value="Low Stock">Low Stock</option>
              <option value="Out of Stock">Out of Stock</option>
              <option value="Expiring Soon">Expiring Soon</option>
              <option value="Expired">Expired</option>
            </select>
            <div class="toolbar__spacer"></div>
            <select class="select" id="perPage" aria-label="Rows per page">
              <option value="10">10 / page</option>
              <option value="25">25 / page</option>
              <option value="50">50 / page</option>
            </select>
          </div>

          <div class="table-wrap">
            <table class="data-table" id="table">
              <thead>
                <tr>
                  <th class="sortable" data-sort="id">ID</th>
                  <th>Image</th>
                  <th class="sortable" data-sort="name">Product</th>
                  <th>Category</th>
                  <th>SKU</th>
                  <th class="sortable num" data-sort="sellingPrice">Price</th>
                  <th class="sortable num" data-sort="stock">Stock</th>
                  <th>Status</th>
                  <th class="num">Actions</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>

          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </body>
</html>
